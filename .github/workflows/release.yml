name: Release

# Cuts a catalog release without anyone editing a version number.
#
#   feat!: / BREAKING CHANGE:  -> major   (deliberate, never accidental)
#   feat:                      -> minor
#   fix: / perf:               -> patch
#   anything else              -> no release at all
#
# The tarball is a purpose-built asset, not GitHub's source archive: the
# marketplace installer (app/marketplace.py, _detect_layout) requires the plugin
# folders to be the tarball's *direct children*, and this repo keeps them two
# levels deep under OutlookWidget/. Source archives are also not byte-stable,
# and the catalog pins a sha256.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and print the catalog block, but do not tag or release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The only knobs. outlook_week stays out until its client.js is a real render
  # rather than the placeholder debug list.
  BUNDLE_FOLDERS: "outlook_core outlook_family outlook_month"
  BUNDLE_NAME: outlook-widgets
  SEED_VERSION: "1.0.0"
  PLUGIN_ROOT: OutlookWidget
  SCHEMA_URL: https://raw.githubusercontent.com/dmellok/tesserae/main/schema/plugin.schema.json

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      bump: ${{ steps.derive.outputs.bump }}
      previous_tag: ${{ steps.derive.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tag history

      - id: derive
        name: Derive the next version from the commit log
        shell: bash
        run: |
          set -euo pipefail

          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)

          if [ -z "$prev" ]; then
            bump=seed
            version="$SEED_VERSION"
          else
            subjects=$(git log --format='%s' "$prev..HEAD")
            bodies=$(git log --format='%B' "$prev..HEAD")

            bump=none
            if printf '%s\n' "$subjects" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
              bump=major
            elif printf '%s\n' "$bodies" | grep -qE '^BREAKING[ -]CHANGE:'; then
              bump=major
            elif printf '%s\n' "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then
              bump=minor
            elif printf '%s\n' "$subjects" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then
              bump=patch
            fi

            base="${prev#v}"
            IFS=. read -r major minor patch <<<"${base%%[-+]*}"
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            version="$major.$minor.$patch"
          fi

          {
            echo "version=$version"
            echo "bump=$bump"
            echo "previous_tag=$prev"
          } >> "$GITHUB_OUTPUT"

          if [ "$bump" = none ]; then
            echo "No feat:/fix:/perf: commit since ${prev}. Nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bump \`$bump\` -> **v$version** (previous: ${prev:-none})" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUMP: ${{ needs.version.outputs.bump }}
      PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage the bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist/bundle

          for folder in $BUNDLE_FOLDERS; do
            src="$PLUGIN_ROOT/$folder"
            [ -d "$src" ] || { echo "::error::$src does not exist"; exit 1; }
            cp -r "$src" "dist/bundle/$folder"
          done

          # tests/ stays in: the bundled tesserae plugins ship theirs, and they
          # are what a catalog reviewer reads alongside the source.
          find dist/bundle -type d \
            \( -name '__pycache__' -o -name '.pytest_cache' -o -name '.ruff_cache' \) \
            -prune -exec rm -rf {} +
          find dist/bundle -type f \
            \( -name '*.pyc' -o -name '*.pyo' -o -name '.DS_Store' \) -delete

      - name: Stamp the version into each manifest
        shell: bash
        run: |
          set -euo pipefail
          # Staging copy only. Nothing is committed back, so there is no
          # in-repo version anybody has to remember to bump.
          python3 - <<'PY'
          import json, os, pathlib

          version = os.environ["VERSION"]
          for manifest in sorted(pathlib.Path("dist/bundle").glob("*/plugin.json")):
              raw = json.loads(manifest.read_text(encoding="utf-8"))
              raw["version"] = version
              # ensure_ascii=False keeps the German strings in the descriptions
              # and sample data as UTF-8 rather than \uXXXX escapes.
              manifest.write_text(
                  json.dumps(raw, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
              )
              print(f"{manifest} -> {version}")
          PY

      - name: Validate the manifests against the host schema
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$SCHEMA_URL" -o plugin.schema.json
          python3 -m pip install --quiet jsonschema
          python3 - <<'PY'
          import json, pathlib, sys

          import jsonschema

          schema = json.loads(pathlib.Path("plugin.schema.json").read_text(encoding="utf-8"))
          manifests = sorted(pathlib.Path("dist/bundle").glob("*/plugin.json"))
          if not manifests:
              sys.exit("::error::no plugin.json found under dist/bundle")

          for manifest in manifests:
              raw = json.loads(manifest.read_text(encoding="utf-8"))
              try:
                  jsonschema.validate(raw, schema)
              except jsonschema.ValidationError as err:
                  sys.exit(f"::error file={manifest}::{err.message}")
              print(f"{manifest}: ok ({raw['kind']}, {raw['version']})")
          PY

      - name: Assert the tarball layout the installer expects
        shell: bash
        run: |
          set -euo pipefail

          # _detect_layout requires every direct child to be a plugin folder,
          # and catalog CI checks these against the entry's `folders` list.
          expected=$(printf '%s\n' $BUNDLE_FOLDERS | sort)
          actual=$(ls -A dist/bundle | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::dist/bundle children do not match BUNDLE_FOLDERS"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi

          for folder in $BUNDLE_FOLDERS; do
            [ -f "dist/bundle/$folder/plugin.json" ] \
              || { echo "::error::dist/bundle/$folder/plugin.json is missing"; exit 1; }
          done

          if find dist/bundle \( -name '__pycache__' -o -name '*.pyc' \) | grep -q .; then
            echo "::error::build artefacts survived the prune"
            exit 1
          fi

      - name: Build the tarball
        id: build
        shell: bash
        run: |
          set -euo pipefail
          tarball="dist/$BUNDLE_NAME-$VERSION.tar.gz"

          # Reproducible: same tree in, same sha256 out, so the sha the catalog
          # pins can be re-derived from the tag by anyone reviewing the PR.
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" \
              --owner=0 --group=0 --numeric-owner --format=gnu \
              -C dist/bundle -cf - $BUNDLE_FOLDERS \
            | gzip -n -9 > "$tarball"

          size=$(stat -c%s "$tarball")
          cap=$((4 * 1024 * 1024)) # _MAX_TARBALL_BYTES in app/marketplace.py
          if [ "$size" -gt "$cap" ]; then
            echo "::error::tarball is $size bytes, over the host's 4 MiB install cap"
            exit 1
          fi

          {
            echo "tarball=$tarball"
            echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)"
            echo "size=$size"
          } >> "$GITHUB_OUTPUT"

          tar tzf "$tarball"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_NAME }}-${{ env.VERSION }}
          path: ${{ steps.build.outputs.tarball }}

      - name: Tag and publish the release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "$PREVIOUS_TAG" ]; then
            git log --no-merges --format='- %s' "$PREVIOUS_TAG..HEAD" > NOTES.md
          else
            git log --no-merges --format='- %s' > NOTES.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

          gh release create "v$VERSION" "${{ steps.build.outputs.tarball }}" \
            --title "v$VERSION" --notes-file NOTES.md

      - name: Publish the private catalog index
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          RELEASE_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail

          # The entry is authored on main (catalog/widgets.json); only the
          # release block is machine-written. The published copy goes to the
          # `catalog` branch, which the branch protection does not cover —
          # github-actions[bot] cannot push to a protected main on a personal
          # repo (neither classic bypass allowances nor ruleset Integration
          # bypass actors are accepted there).
          python3 - <<'PY'
          import json, os, pathlib

          version = os.environ["VERSION"]
          index = json.loads(pathlib.Path("catalog/widgets.json").read_text(encoding="utf-8"))

          entries = index["widgets"]
          if len(entries) != 1:
              raise SystemExit(f"::error::expected exactly 1 catalog entry, found {len(entries)}")

          entries[0]["release"] = {
              "version": version,
              "tarball_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/releases/download/v{version}/{os.environ['BUNDLE_NAME']}-{version}.tar.gz"
              ),
              "sha256": os.environ["RELEASE_SHA256"],
          }

          # Declared folders must match what the tarball actually shipped.
          declared = entries[0].get("folders")
          shipped = os.environ["BUNDLE_FOLDERS"].split()
          if declared is not None and sorted(declared) != sorted(shipped):
              raise SystemExit(
                  f"::error::catalog `folders` {declared} != BUNDLE_FOLDERS {shipped}"
              )

          out = pathlib.Path("publish")
          out.mkdir(exist_ok=True)
          (out / "widgets.json").write_text(
              json.dumps(index, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(json.dumps(entries[0]["release"], indent=2))
          PY

          # Screenshots are authored on main too; the Browse card resolves them
          # relative to the index URL, so they must sit beside it once published.
          if [ -d catalog/screenshots ]; then
            cp -r catalog/screenshots publish/screenshots
          fi

          # A generated index has no history worth keeping — main holds that.
          # Single-commit orphan branch, replaced each release.
          cd publish
          rm -rf .git
          git init -q -b catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # [skip ci] is belt-and-braces: pushes to `catalog` do not match any
          # workflow trigger, so nothing would re-run regardless.
          git commit -q -m "catalog: v$VERSION [skip ci]"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            catalog

      - name: Print the catalog entry block
        shell: bash
        run: |
          set -euo pipefail
          export RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/v$VERSION/$BUNDLE_NAME-$VERSION.tar.gz"
          export RELEASE_SHA="${{ steps.build.outputs.sha256 }}"

          block=$(python3 - <<'PY'
          import json, os

          print(json.dumps({"release": {
              "version": os.environ["VERSION"],
              "tarball_url": os.environ["RELEASE_URL"],
              "sha256": os.environ["RELEASE_SHA"],
          }}, indent=2))
          PY
          )

          {
            echo "## Catalog \`release\` block"
            echo
            if [ "$DRY_RUN" != "true" ]; then
              echo "Already published to the private index on the \`catalog\` branch —"
              echo "installations pointed at it will offer this as an update."
              echo
            fi
            echo "For the public catalog, paste into the \`outlook\` entry in \`widgets.json\` on"
            echo "[dmellok/tesserae-widgets](https://github.com/dmellok/tesserae-widgets);"
            echo "\`catalog/widgets.json\` in this repo holds the rest of the entry."
            echo
            echo '```json'
            echo "$block"
            echo '```'
            echo
            echo "Tarball: ${{ steps.build.outputs.size }} bytes, folders \`$BUNDLE_FOLDERS\`."
            if [ "$DRY_RUN" = "true" ]; then
              echo
              echo "> Dry run: no tag and no release were created."
            fi
            if [ "$BUMP" = "major" ]; then
              echo
              echo "> **Major bump.** Re-check the entry's \`tesserae_compat\` and \`description\`,"
              echo "> and say what broke in the catalog PR — existing installs will be offered this."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
